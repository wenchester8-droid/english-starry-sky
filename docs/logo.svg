<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="512" height="512">
  <style>
    .t,.a,.o,.n{transform-box:view-box;transform-origin:32px 32px}
    .a{animation:s 14s linear infinite}
    .o{animation:s 7s linear infinite}
    .n{animation:w 4.8s ease-in-out infinite}
    @keyframes s{to{transform:rotate(360deg)}}
    @keyframes w{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(9deg)}}
    @media (prefers-reduced-motion:reduce){.a,.o,.n{animation:none}}
  </style>
  <defs>
    <radialGradient id="bg" cx="50%" cy="38%" r="65%"><stop offset="0" stop-color="#1B2C5A"/><stop offset="1" stop-color="#070C1E"/></radialGradient>
    <linearGradient id="nd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8FF6FF"/><stop offset="1" stop-color="#3D7BFF"/></linearGradient>
    <filter id="gl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="29" fill="none" stroke="#5FE3FF" stroke-opacity=".45" stroke-width=".8"/>
  <g class="t">
    <circle cx="32" cy="32" r="26" fill="none" stroke="#9FDFFF" stroke-opacity=".55" stroke-width="2" stroke-dasharray=".5 1.77"/>
    <path d="M32 3.5v5M60.5 32h-5M32 60.5v-5M3.5 32h5" stroke="#CFF6FF" stroke-width="1.4" stroke-linecap="round"/>
  </g>
  <g class="a">
    <circle cx="32" cy="32" r="21" fill="none" stroke="#5FE3FF" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="18 15"/>
    <circle cx="32" cy="32" r="17" fill="none" stroke="#A78BFF" stroke-opacity=".7" stroke-width=".8" stroke-dasharray="4 3 26 20"/>
  </g>
  <g class="o" filter="url(#gl)"><circle cx="32" cy="3" r="1.9" fill="#FFFFFF"/></g>
  <g class="n" filter="url(#gl)">
    <path d="M32 9 36.2 32H27.8Z" fill="url(#nd)"/>
    <path d="M32 55 36.2 32H27.8Z" fill="#B9C4E6" fill-opacity=".35"/>
    <path d="M32 9V32" stroke="#FFFFFF" stroke-opacity=".7" stroke-width=".6"/>
  </g>
  <circle cx="32" cy="32" r="3.2" fill="#070C1E" stroke="#8FF6FF" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="1.1" fill="#8FF6FF"/>
</svg>
