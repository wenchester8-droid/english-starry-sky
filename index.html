<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 让微信等内置浏览器每次都重新取这个页面，不用旧的 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F1E7" />
    <title>英语星空 · 人教版初中英语</title>
    <meta name="description" content="人教版初中英语：课本单词（课本原声、插画、例句）、语法与句型考点、河南中考真题提示。" />
    <link rel="icon" type="image/png" href="%BASE_URL%favicon.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icon-512.png" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="preload" href="%BASE_URL%atlas/index.json" as="fetch" crossorigin="anonymous" />
    <script>
      // Apply the saved theme (follows the system by default) before first paint.
      (function () {
        var t = "system";
        try {
          var s = JSON.parse(localStorage.getItem("word-atlas:settings") || "{}");
          if (s.theme) t = s.theme;
        } catch (e) {}
        if (t !== "system") document.documentElement.setAttribute("data-theme", t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
